<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- ears (outer burgundy outline + inner cream) -->
  <rect x="6" y="2" width="3" height="6" fill="#430A21"/>
  <rect x="15" y="2" width="3" height="6" fill="#430A21"/>
  <rect x="7" y="3" width="1" height="4" fill="#F2A2AD"/>
  <rect x="16" y="3" width="1" height="4" fill="#F2A2AD"/>

  <!-- head (rose with burgundy outline) -->
  <rect x="5" y="7" width="14" height="9" fill="#430A21"/>
  <rect x="6" y="8" width="12" height="7" fill="#F2A2AD"/>

  <!-- eyes (black dots) -->
  <rect x="8" y="10" width="2" height="2" fill="#430A21"/>
  <rect x="14" y="10" width="2" height="2" fill="#430A21"/>

  <!-- mouth/nose (small rose accent) -->
  <rect x="11" y="13" width="2" height="1" fill="#C85C77"/>

  <!-- body -->
  <rect x="7" y="16" width="10" height="6" fill="#430A21"/>
  <rect x="8" y="17" width="8" height="4" fill="#F2A2AD"/>

  <!-- feet -->
  <rect x="7" y="22" width="3" height="2" fill="#430A21"/>
  <rect x="14" y="22" width="3" height="2" fill="#430A21"/>
</svg>
