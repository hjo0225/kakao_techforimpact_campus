<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- cap (rose with burgundy outline) -->
  <rect x="6" y="2" width="10" height="4" fill="#430A21"/>
  <rect x="7" y="3" width="8" height="2" fill="#C85C77"/>
  <rect x="4" y="5" width="12" height="2" fill="#430A21"/>

  <!-- face (cream skin) -->
  <rect x="6" y="6" width="10" height="6" fill="#430A21"/>
  <rect x="7" y="7" width="8" height="4" fill="#F8EAC9"/>

  <!-- eyes -->
  <rect x="9" y="9" width="1" height="1" fill="#430A21"/>
  <rect x="12" y="9" width="1" height="1" fill="#430A21"/>

  <!-- body / jersey (rose) -->
  <rect x="5" y="12" width="12" height="7" fill="#430A21"/>
  <rect x="6" y="13" width="10" height="5" fill="#C85C77"/>

  <!-- bat (warm cream / wood) -->
  <rect x="16" y="6" width="2" height="2" fill="#430A21"/>
  <rect x="17" y="7" width="2" height="2" fill="#B07800"/>
  <rect x="18" y="8" width="2" height="2" fill="#B07800"/>
  <rect x="19" y="9" width="2" height="2" fill="#B07800"/>
  <rect x="20" y="10" width="2" height="2" fill="#B07800"/>
  <rect x="21" y="11" width="2" height="2" fill="#F8EAC9"/>

  <!-- legs -->
  <rect x="6" y="19" width="3" height="4" fill="#430A21"/>
  <rect x="13" y="19" width="3" height="4" fill="#430A21"/>
  <rect x="7" y="20" width="1" height="2" fill="#F8EAC9"/>
  <rect x="14" y="20" width="1" height="2" fill="#F8EAC9"/>
</svg>
